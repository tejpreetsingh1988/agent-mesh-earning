[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mesh-earnings"
version = "0.1.0"
description = "Agent Mesh Research Lab: A2A + MCP earnings briefing system (Day 2: live MCP tools)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "yfinance>=0.2",
    # LLM story client only (Writer): LangChain prompt + OpenAI-compatible
    # ChatOpenAI pointed at OpenRouter. Analyst/Critic stay deterministic.
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
ui = ["streamlit>=1.35"]

[tool.setuptools]
packages = ["mesh"]

[tool.ruff]
line-length = 100
